<div class="phone">
  <div class="pbody" style="padding-top: 48px; gap: 28px"><div style="position: relative; width: 220px; height: 157px"><div class="orb" style="position: absolute; width: 132px; height: 132px; left: 18px; top: 14px; filter: blur(10px); opacity: .95"></div><svg class="art" style="position: relative" viewBox="0 0 280 200" width="220" aria-hidden="true"><defs><radialGradient id="cs1" cx="0.35" cy="0.35" r="0.75"><stop offset="0" stop-color="#C2C78A" stop-opacity="0.9"></stop><stop offset="1" stop-color="#C2C78A" stop-opacity="0"></stop></radialGradient></defs><g fill="none" stroke="#2A2927" stroke-width="1"><circle cx="122.75" cy="39.25" r="27"></circle><circle cx="191.75" cy="39.25" r="27"></circle><circle cx="88.25" cy="100.75" r="27" fill="url(#cs1)"></circle><circle cx="122.75" cy="160.75" r="27"></circle><circle cx="191.75" cy="160.75" r="27"></circle></g></svg></div>
    <div class="hstack g12"><svg width="30" height="34" viewBox="0 0 105 117" aria-hidden="true"><g fill="currentColor"><circle cx="41" cy="18" r="18"></circle><circle cx="87" cy="18" r="18"></circle><circle cx="18" cy="59" r="18"></circle><circle cx="41" cy="99" r="18"></circle><circle cx="87" cy="99" r="18"></circle></g></svg><span class="heading">Cueue</span></div>
