<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cueue · Client settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Mate:ital@0;1&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cueue.css">
<script src="/proto.js" defer></script>
<link rel="icon" href="/favicon.svg">
<style>body{margin:0;background:#E0E4E4;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:16px 0 72px;box-sizing:border-box}.phone{border-radius:40px;overflow:hidden;box-shadow:var(--shadow-lg)}@view-transition{navigation:auto}.side{view-transition-name:side}::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}.proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(38,40,43,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow-lg);view-transition-name:protobar}.proto-bar a{font:500 12px/16px var(--sans);color:rgba(247,248,248,.7);text-decoration:none;padding:7px 14px;border-radius:999px}.proto-bar a.on{background:rgba(247,248,248,.14);color:#F7F8F8}.proto-bar a:hover{color:#F7F8F8}.proto-toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-12px);opacity:0;z-index:70;transition:all .2s ease;background:var(--ink);color:#F7F8F8;font:500 13px/18px var(--sans);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-lg)}.proto-toast.in{opacity:1;transform:translate(-50%,0)}.toggle{cursor:pointer}.main{padding-bottom:96px}.phone{height:min(844px,calc(100dvh - 96px));min-height:0;overflow-y:auto}</style>
</head>
<body>

<div class="phone">
  <div class="ptop"><a class="label muted" href="/CProjects" style="text-decoration: none">‹ Projects</a><span class="avatar blue">RL</span></div>
  <div class="pbody">
    <h1 class="title">Settings</h1>
    <section class="card g16">
      <h2 class="sub">Account</h2>
      <label class="field"><span>Name</span><input class="input" value="Rosa Lindqvist"></label>
      <label class="field"><span>Email</span><input class="input" value="rosa@fernhilloutdoor.com"></label>
      <label class="field"><span>Company</span><input class="input" value="Fernhill Outdoor Co."></label>
    </section>
    <section class="card g16">
      <h2 class="sub">Password</h2>
      <label class="field"><span>Current password</span><input class="input" type="password" value="password12"></label>
      <label class="field"><span>New password</span><input class="input" type="password" value="password1234"><span class="cap muted">Strong enough</span></label>
    </section>
    <section class="card g16">
      <h2 class="sub">Notifications · by email</h2>
      <div class="hstack between g12"><span class="body">Work is ready to review</span><span class="toggle on" role="img" aria-label="On"></span></div>
      <div class="hstack between g12"><span class="body">A payment is due</span><span class="toggle on" role="img" aria-label="On"></span></div>
      <div class="hstack between g12"><span class="body">A feedback deadline is close</span><span class="toggle on" role="img" aria-label="On"></span></div>
      <span class="cap muted">We never send marketing emails.</span>
    </section>
    <a class="btn btn-p btn-full" href="/CProjects">Save changes</a>
    <a class="btn btn-s btn-full" href="/CSignIn">Log out</a>
  </div>
</div>

<nav class="proto-bar" aria-label="Prototype"><a href="/">Studio app</a><a href="/CSignIn" class="on">Client app</a><a href="/screens">All screens</a></nav>
</body>
</html>
