      if (st.view === 'year') {
        per.textContent = st.year + ' → Mar ’' + String(st.year + 1).slice(2);
        box.innerHTML = timeline(Date.UTC(st.year, 0, 1) / 864e5, Date.UTC(st.year + 1, 3, 1) / 864e5, 'year');
      } else if (st.view === 'month') {
        per.textContent = MOL[st.mM] + ' ' + st.mY;
        box.innerHTML = timeline(Date.UTC(st.mY, st.mM, 1) / 864e5, Date.UTC(st.mY, st.mM + 1, 1) / 864e5, 'month');
      } else {
        var e = st.wk + 6, x = dt(st.wk), y = dt(e);
        per.textContent = MO[x.getUTCMonth()] + ' ' + x.getUTCDate() + ' – ' + (x.getUTCMonth() === y.getUTCMonth() ? '' : MO[y.getUTCMonth()] + ' ') + y.getUTCDate();
        box.innerHTML = week(st.wk);
      }
    }
    var tt;
    function toast(m) { var el = document.getElementById('gtoast'); el.textContent = m; el.classList.add('in'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('in'); }, 1800); }
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-a]'); if (!b) return;
      var id = b.closest('[data-s]').dataset.s;
      if (b.dataset.a === 'add') { st.added[id] = 1; toast('Added to your roadmap'); } else { delete st.added[id]; toast('Removed'); }
      render();
    });
    document.getElementById('gview').addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return; e.preventDefault(); st.view = a.dataset.v;
      [].forEach.call(document.querySelectorAll('#gview a'), function (x) { x.classList.toggle('on', x === a); });
      render();
    });
    document.querySelector('.gr-nav').addEventListener('click', function (e) {
      var b = e.target.closest('.gn'); if (!b) return; var n = +b.dataset.n;
      if (st.view === 'year') st.year = n ? Math.min(2027, Math.max(2025, st.year + n)) : 2026;
      else if (st.view === 'month') { if (!n) { st.mY = 2026; st.mM = 9; } else { st.mM += n; if (st.mM > 11) { st.mM = 0; st.mY++; } if (st.mM < 0) { st.mM = 11; st.mY--; } } }
      else st.wk = n ? st.wk + 7 * n : T - ((dt(T).getUTCDay() + 6) % 7);
      render();
    });
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });
    render();
  })();
  </script>
</main>
