<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cueue · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;1,400&family=Mate:ital@0;1&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cueue.css">
<link rel="stylesheet" href="/cueue-v2.css">
<script src="/proto.js" defer></script>
<link rel="icon" href="/favicon.svg">
<style>body{margin:0;}.phone{border-radius:40px;overflow:hidden;box-shadow:var(--shadow-lg)}@view-transition{navigation:auto}.side{view-transition-name:side}::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}.proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(40,40,42,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow-lg);view-transition-name:protobar}.proto-bar a{font:500 12px/16px var(--sans);color:rgba(248,248,246,.7);text-decoration:none;padding:7px 14px;border-radius:999px}.proto-bar a.on{background:rgba(248,248,246,.14);color:#F8F8F6}.proto-bar a:hover{color:#F8F8F6}.proto-toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-12px);opacity:0;z-index:70;transition:all .2s ease;background:var(--ink);color:#F8F8F6;font:500 13px/18px var(--sans);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-lg)}.proto-toast.in{opacity:1;transform:translate(-50%,0)}.toggle{cursor:pointer}.main{padding-bottom:96px}</style>
</head>
<body>

<div class="signin-page" style="min-height:100vh;display:grid;place-items:center;background:var(--paper);padding:40px">
  <div class="bframe" style="width:520px;max-width:100%">
    <section class="card" style="padding:44px 44px 36px;gap:28px">
      <div class="hstack g12"><svg width="30" height="34" viewBox="0 0 105 117" aria-hidden="true"><g fill="currentColor"><circle cx="41" cy="18" r="18"></circle><circle cx="87" cy="18" r="18"></circle><circle cx="18" cy="59" r="18"></circle><circle cx="41" cy="99" r="18"></circle><circle cx="87" cy="99" r="18"></circle></g></svg><span style="font-weight:500;font-size:18px">Cueue</span></div>
      <div class="stack g8"><h1 class="title" style="font-family:var(--serif);font-weight:400">Sign in to your studio</h1><p class="body muted">One place for the plan, the work and the money.</p></div>
      <form class="stack g16">
        <label class="field"><span>Email</span><input class="input" type="email" value="mina@studiopark.co"></label>
        <label class="field"><span>Password</span><input class="input" type="password" value="password12"></label>
        <a class="btn btn-p btn-full" href="/Main">Sign in</a>
        <a class="btn btn-s btn-full" href="/Main">Create a studio account</a>
      </form>
      <p class="cap muted">Clients do not sign in here. They arrive on an invite link.</p>
    </section>
  </div>
</div>

<nav class="proto-bar" aria-label="Prototype"><a href="/" class="on">Studio app</a><a href="/CSignIn">Client app</a><a href="/screens">All screens</a></nav>
</body>
</html>
